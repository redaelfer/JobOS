<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Save to JobOS</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body><header><b>j.</b><h1>Save to JobOS</h1></header><p>Capture this opportunity. Make it yours.</p><p id="status" role="status" aria-live="polite"></p><form id="capture"><label>Job title<input name="title" required></label><label>Company<input name="company" required></label><label>Location<input name="location"></label><label>Job URL<input name="url" type="url" required></label><label>Job description<textarea name="description" rows="4"></textarea></label><button id="save">Save opportunity</button></form><button id="retry" type="button" class="secondary">Capture current job again</button><details><summary>Connection settings</summary><form id="connection"><label>JobOS address<input name="endpoint" type="url" value="http://127.0.0.1:4317" required></label><label>Pairing token<input name="token" type="password" required></label><button>Save connection</button></form><p>Copy your token from JobOS → Settings. Keep the JobOS server running.</p></details></body></html>
